openapi: 3.1.0
info:
  title: 長輩圖政策宣傳 API
  version: 1.0.0
  description: |
    長輩圖政策宣傳專案 MVP 的前後端 API 契約。
    Demo 環境以 X-Demo-User header 識別目前使用者。
servers:
  - url: /api
    description: 與前端同網域的 API base path
tags:
  - name: Me
    description: 目前登入的 Demo 使用者、徽章與個人作品。
  - name: Backgrounds
    description: 長輩圖背景素材與依作品數計算的解鎖狀態。
  - name: Policies
    description: 可用政策類別、政策內容與編輯器宣傳標語。
  - name: Artworks
    description: 公開作品、圖片上傳、按讚與下載。
  - name: Leaderboard
    description: 依作品按讚數及下載數計算的全期間排行榜。
security:
  - DemoUser: []
paths:
  /v1/me:
    get:
      tags: [Me]
      operationId: getCurrentUser
      summary: 取得目前使用者與徽章資訊
      description: 依 `X-Demo-User` 取得使用者基本資料、目前作品數，以及作品數對應的最高徽章。
      responses:
        "200":
          description: 目前使用者
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/me/artworks:
    get:
      tags: [Me, Artworks]
      operationId: listMyArtworks
      summary: 取得目前使用者的作品
      description: 回傳目前使用者建立的作品分頁，依建立時間由新到舊排列。
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 個人作品分頁，依建立時間由新到舊
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtworkPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/backgrounds:
    get:
      tags: [Backgrounds]
      operationId: listBackgrounds
      summary: 取得所有啟用中的背景與目前使用者的解鎖狀態
      description: "`unlocked` 依目前使用者的作品數與背景解鎖門檻即時計算；未解鎖背景仍會列出供前端展示。"
      responses:
        "200":
          description: 背景清單
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Background"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/policy-categories:
    get:
      tags: [Policies]
      operationId: listPolicyCategories
      summary: 取得目前可選政策的類別
      description: 只回傳至少包含一筆目前有效政策的類別，名稱可直接帶入 `GET /v1/policies` 的 `category`。
      responses:
        "200":
          description: 政策類別名稱清單
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example:
                - 社會福利
                - 交通安全
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/policies:
    get:
      tags: [Policies]
      operationId: listPolicies
      summary: 依類別取得目前可選的政策
      description: 只回傳管理者已啟用且符合申辦起訖日條件的政策；類別名稱必須完整相符。
      parameters:
        - name: category
          in: query
          required: true
          description: 完整的政策類別名稱
          schema:
            type: string
            minLength: 1
            maxLength: 50
            example: 老人
      responses:
        "200":
          description: 政策清單
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Policy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/policies/random:
    get:
      tags: [Policies]
      operationId: getRandomPolicy
      summary: 隨機取得一筆目前可選的政策
      description: |
        只會選擇管理者已啟用，且符合申辦起訖日條件的政策。startDate 為 null
        表示無起日限制，endDate 為 null 表示持續辦理、無截止日限制。
        連續呼叫可能回傳相同政策；此 API 不隨機選擇背景。
      responses:
        "200":
          description: 隨機政策
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/artworks:
    get:
      tags: [Artworks]
      operationId: listArtworks
      summary: 取得公開作品
      description: 回傳公開作品分頁，依建立時間由新到舊；`likedByMe` 與 `ownedByMe` 依目前使用者計算。
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 公開作品分頁，依建立時間由新到舊
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtworkPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Artworks]
      operationId: createArtwork
      summary: 建立作品
      description: |
        圖片必須是 1080 x 1080 PNG，且不得超過 10 MB。
        後端會先上傳 S3，成功後才建立資料庫紀錄。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateArtworkRequest"
            encoding:
              image:
                contentType: image/png
      responses:
        "201":
          description: 作品建立成功
          headers:
            Location:
              description: 新作品 URI
              schema:
                type: string
                example: /api/v1/artworks/123
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artwork"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/artworks/{artworkId}:
    get:
      tags: [Artworks]
      operationId: getArtwork
      summary: 取得作品詳情
      description: 取得單一公開作品、作者摘要、目前按讚／下載統計，以及目前使用者的互動狀態。
      parameters:
        - $ref: "#/components/parameters/ArtworkId"
      responses:
        "200":
          description: 作品詳情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artwork"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/artworks/{artworkId}/like:
    put:
      tags: [Artworks]
      operationId: likeArtwork
      summary: 將作品設為已按愛心
      description: 此操作具冪等性；重複呼叫不會重複增加愛心數。
      parameters:
        - $ref: "#/components/parameters/ArtworkId"
      responses:
        "200":
          description: 最新愛心狀態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Artworks]
      operationId: unlikeArtwork
      summary: 取消作品愛心
      description: 此操作具冪等性；未按愛心時呼叫仍回傳未按愛心狀態。
      parameters:
        - $ref: "#/components/parameters/ArtworkId"
      responses:
        "200":
          description: 最新愛心狀態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/artworks/{artworkId}/download:
    get:
      tags: [Artworks]
      operationId: downloadArtwork
      summary: 下載附政策 QR Code 的 PNG
      description: |
        QR Code 由後端即時合成。作者可以下載自己的作品，但不增加下載數；
        非作者每次成功產生下載檔案都增加一次下載數。
      parameters:
        - $ref: "#/components/parameters/ArtworkId"
      responses:
        "200":
          description: 1080 x 1080 PNG
          headers:
            Content-Disposition:
              description: 下載檔名
              schema:
                type: string
                example: attachment; filename="artwork-123.png"
          content:
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/leaderboard:
    get:
      tags: [Leaderboard]
      operationId: getLeaderboard
      summary: 取得全期間作品排行榜前 100 名
      description: |
        score = max(likeCount, downloadCount)。同分使用 competition ranking，
        例如 1、2、2、4；同分顯示順序依建立時間由新到舊。
      responses:
        "200":
          description: 排行榜
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    DemoUser:
      type: apiKey
      in: header
      name: X-Demo-User
      description: Demo 使用者 allowlist 中的代號，例如 user-a。

  parameters:
    ArtworkId:
      name: artworkId
      in: path
      required: true
      description: 作品唯一識別碼。
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 123
    Page:
      name: page
      in: query
      description: 從 0 開始的頁碼
      schema:
        type: integer
        minimum: 0
        default: 0
        example: 0
    Size:
      name: size
      in: query
      description: 每頁筆數
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        example: 20

  examples:
    ValidationFailed:
      summary: 欄位驗證失敗
      value:
        type: about:blank
        title: Bad Request
        status: 400
        detail: Request validation failed
        instance: /api/v1/artworks
        code: VALIDATION_FAILED
        traceId: 6f44d183-f415-4c2c-9b2f-c35b657a15dc
    RequestInvalid:
      summary: 參數型別、必要欄位或 request body 不合法
      value:
        type: about:blank
        title: Bad Request
        status: 400
        detail: Request is invalid
        instance: /api/v1/artworks
        code: REQUEST_INVALID
        traceId: 6f44d183-f415-4c2c-9b2f-c35b657a15dc
    ArtworkImageInvalid:
      summary: 上傳內容不是有效 PNG
      value:
        type: about:blank
        title: Bad Request
        status: 400
        detail: Artwork image must be a valid PNG
        instance: /api/v1/artworks
        code: ARTWORK_IMAGE_INVALID
        traceId: 6f44d183-f415-4c2c-9b2f-c35b657a15dc
    ArtworkImageDimensionsInvalid:
      summary: PNG 尺寸不是 1080 x 1080
      value:
        type: about:blank
        title: Bad Request
        status: 400
        detail: Artwork image must be 1080 x 1080 pixels
        instance: /api/v1/artworks
        code: ARTWORK_IMAGE_DIMENSIONS_INVALID
        traceId: 6f44d183-f415-4c2c-9b2f-c35b657a15dc
    PageInvalid:
      summary: 分頁參數不合法
      value:
        type: about:blank
        title: Bad Request
        status: 400
        detail: Page must not exceed the available range
        instance: /api/v1/artworks
        code: PAGE_INVALID
        traceId: 6f44d183-f415-4c2c-9b2f-c35b657a15dc
    AuthRequired:
      summary: 缺少 Demo 使用者 header
      value:
        type: about:blank
        title: Unauthorized
        status: 401
        detail: X-Demo-User header is required
        instance: /api/v1/me
        code: AUTH_REQUIRED
        traceId: 6f44d183-f415-4c2c-9b2f-c35b657a15dc
    AuthInvalid:
      summary: Demo 使用者不在 allowlist
      value:
        type: about:blank
        title: Unauthorized
        status: 401
        detail: X-Demo-User is not allowed
        instance: /api/v1/me
        code: AUTH_INVALID
        traceId: 6f44d183-f415-4c2c-9b2f-c35b657a15dc
    BackgroundLocked:
      summary: 作品數尚未達到背景解鎖門檻
      value:
        type: about:blank
        title: Forbidden
        status: 403
        detail: Background is not unlocked for the current user
        instance: /api/v1/artworks
        code: BACKGROUND_LOCKED
        traceId: 6f44d183-f415-4c2c-9b2f-c35b657a15dc
    BackgroundUnavailable:
      summary: 背景已停用
      value:
        type: about:blank
        title: Forbidden
        status: 403
        detail: Background is unavailable
        instance: /api/v1/artworks
        code: BACKGROUND_UNAVAILABLE
        traceId: 6f44d183-f415-4c2c-9b2f-c35b657a15dc
    PolicyUnavailable:
      summary: 政策已停用或不在有效期間
      value:
        type: about:blank
        title: Forbidden
        status: 403
        detail: Policy is unavailable
        instance: /api/v1/artworks
        code: POLICY_UNAVAILABLE
        traceId: 6f44d183-f415-4c2c-9b2f-c35b657a15dc
    ArtworkNotFound:
      summary: 找不到指定作品
      value:
        type: about:blank
        title: Not Found
        status: 404
        detail: Artwork was not found
        instance: /api/v1/artworks/123
        code: ARTWORK_NOT_FOUND
        traceId: 6f44d183-f415-4c2c-9b2f-c35b657a15dc
    BackgroundNotFound:
      summary: 找不到指定背景
      value:
        type: about:blank
        title: Not Found
        status: 404
        detail: Background was not found
        instance: /api/v1/artworks
        code: BACKGROUND_NOT_FOUND
        traceId: 6f44d183-f415-4c2c-9b2f-c35b657a15dc
    PolicyNotFound:
      summary: 找不到指定政策
      value:
        type: about:blank
        title: Not Found
        status: 404
        detail: Policy was not found
        instance: /api/v1/artworks
        code: POLICY_NOT_FOUND
        traceId: 6f44d183-f415-4c2c-9b2f-c35b657a15dc
    ResourceNotFound:
      summary: 找不到指定資源或目前沒有可用政策
      value:
        type: about:blank
        title: Not Found
        status: 404
        detail: The requested resource was not found
        instance: /api/v1/policies/random
        code: RESOURCE_NOT_FOUND
        traceId: 6f44d183-f415-4c2c-9b2f-c35b657a15dc
    SelfLikeNotAllowed:
      summary: 作者不能對自己的作品按愛心
      value:
        type: about:blank
        title: Conflict
        status: 409
        detail: Authors cannot like their own artwork
        instance: /api/v1/artworks/123/like
        code: SELF_LIKE_NOT_ALLOWED
        traceId: 6f44d183-f415-4c2c-9b2f-c35b657a15dc
    RequestRejected:
      summary: Request 與目前業務狀態衝突
      value:
        type: about:blank
        title: Conflict
        status: 409
        detail: Request conflicts with the current resource state
        instance: /api/v1/artworks/123/like
        code: REQUEST_REJECTED
        traceId: 6f44d183-f415-4c2c-9b2f-c35b657a15dc
    ArtworkImageTooLarge:
      summary: 圖片超過 10 MB
      value:
        type: about:blank
        title: Content Too Large
        status: 413
        detail: Artwork image must not exceed 10 MB
        instance: /api/v1/artworks
        code: ARTWORK_IMAGE_TOO_LARGE
        traceId: 6f44d183-f415-4c2c-9b2f-c35b657a15dc
    RateLimited:
      summary: AWS WAF rate limit
      value:
        type: about:blank
        title: Too Many Requests
        status: 429
        detail: Too many download requests
        instance: /api/v1/artworks/123/download
        code: RATE_LIMITED
        traceId: waf-generated-request-id
    InternalError:
      summary: 未預期的後端錯誤
      value:
        type: about:blank
        title: Internal Server Error
        status: 500
        detail: An unexpected error occurred
        instance: /api/v1/artworks
        code: INTERNAL_ERROR
        traceId: 6f44d183-f415-4c2c-9b2f-c35b657a15dc
    StorageUnavailable:
      summary: S3 暫時不可用
      value:
        type: about:blank
        title: Service Unavailable
        status: 503
        detail: Artwork storage is temporarily unavailable
        instance: /api/v1/artworks
        code: STORAGE_UNAVAILABLE
        traceId: 6f44d183-f415-4c2c-9b2f-c35b657a15dc

  responses:
    BadRequest:
      description: Request 欄位或內容不合法
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            validationFailed:
              $ref: "#/components/examples/ValidationFailed"
            requestInvalid:
              $ref: "#/components/examples/RequestInvalid"
            artworkImageInvalid:
              $ref: "#/components/examples/ArtworkImageInvalid"
            artworkImageDimensionsInvalid:
              $ref: "#/components/examples/ArtworkImageDimensionsInvalid"
            pageInvalid:
              $ref: "#/components/examples/PageInvalid"
    Unauthorized:
      description: 缺少或無效的 X-Demo-User
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            authRequired:
              $ref: "#/components/examples/AuthRequired"
            authInvalid:
              $ref: "#/components/examples/AuthInvalid"
    Forbidden:
      description: 目前使用者無權執行，例如使用未解鎖背景
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            backgroundLocked:
              $ref: "#/components/examples/BackgroundLocked"
            backgroundUnavailable:
              $ref: "#/components/examples/BackgroundUnavailable"
            policyUnavailable:
              $ref: "#/components/examples/PolicyUnavailable"
    NotFound:
      description: 指定資源不存在
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            artworkNotFound:
              $ref: "#/components/examples/ArtworkNotFound"
            backgroundNotFound:
              $ref: "#/components/examples/BackgroundNotFound"
            policyNotFound:
              $ref: "#/components/examples/PolicyNotFound"
            resourceNotFound:
              $ref: "#/components/examples/ResourceNotFound"
    Conflict:
      description: 業務狀態衝突，例如作者對自己的作品按愛心
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            selfLikeNotAllowed:
              $ref: "#/components/examples/SelfLikeNotAllowed"
            requestRejected:
              $ref: "#/components/examples/RequestRejected"
    PayloadTooLarge:
      description: 上傳圖片超過 10 MB
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            artworkImageTooLarge:
              $ref: "#/components/examples/ArtworkImageTooLarge"
    TooManyRequests:
      description: 超過 API rate limit
      headers:
        Retry-After:
          description: 建議重試等待秒數
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            rateLimited:
              $ref: "#/components/examples/RateLimited"
    InternalServerError:
      description: 未預期的後端錯誤
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            internalError:
              $ref: "#/components/examples/InternalError"
    ServiceUnavailable:
      description: S3 或資料庫暫時不可用
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            storageUnavailable:
              $ref: "#/components/examples/StorageUnavailable"

  schemas:
    CurrentUser:
      type: object
      description: 目前 Demo 使用者的基本資料、作品數與最高等級徽章。
      required:
        - id
        - account
        - displayName
        - artworkCount
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: 系統內部使用者 ID。
        account:
          type: string
          maxLength: 64
          description: Demo 帳號代號，對應 `X-Demo-User`。
        displayName:
          type: string
          maxLength: 100
          description: 前端顯示名稱。
        artworkCount:
          type: integer
          format: int64
          minimum: 0
          description: 使用者目前已建立的作品總數，用於計算徽章與背景解鎖。
        badge:
          description: 依作品數取得的最高等級徽章；尚未達第一級門檻時為 null。
          oneOf:
            - $ref: "#/components/schemas/Badge"
            - type: "null"
        createdAt:
          type: string
          format: date-time
          description: 使用者首次建立於系統的 UTC 時間。
      example:
        id: 1
        account: user-a
        displayName: 小明
        artworkCount: 4
        badge:
          level: 3
          name: 四方送暖
          iconUrl: https://example.invalid/presigned-badge-url
        createdAt: "2026-11-07T08:30:00Z"

    Badge:
      type: object
      description: 使用者依累積作品數獲得的最高等級徽章。
      required: [level, name, iconUrl]
      properties:
        level:
          type: integer
          minimum: 1
          maximum: 10
          description: 徽章等級，數字越大代表累積作品越多。
        name:
          type: string
          description: 徽章中文名稱。
        iconUrl:
          type: string
          format: uri
          description: 有效期 15 分鐘的 S3 presigned URL
      example:
        level: 3
        name: 四方送暖
        iconUrl: https://assets.example.com/badges/3/badge.png?X-Amz-Expires=900

    Background:
      type: object
      description: 長輩圖可用的背景素材與目前使用者的解鎖狀態。
      required: [id, name, imageUrl, unlockThreshold, unlocked]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: 背景唯一識別碼。
        name:
          type: string
          maxLength: 100
          description: 背景中文名稱。
        imageUrl:
          type: string
          format: uri
          description: 有效期 15 分鐘的 S3 presigned URL
        unlockThreshold:
          type: integer
          minimum: 0
          description: 解鎖此背景所需的最少作品數；0 表示所有使用者皆可使用。
        unlocked:
          type: boolean
          description: 目前使用者是否已達到解鎖門檻。
      example:
        id: 1
        name: 台北晨曦
        imageUrl: https://assets.example.com/backgrounds/taipei-sunrise.png?X-Amz-Expires=900
        unlockThreshold: 0
        unlocked: true

    Policy:
      type: object
      description: 可載入長輩圖編輯器的政策內容與官方來源。
      required: [id, category, title, slogan, sourceUrl, startDate, endDate]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: 政策唯一識別碼。
        category:
          type: string
          maxLength: 50
          description: 政策類別名稱，例如民生費用、生育或老人。
        title:
          type: string
          maxLength: 255
          description: 政策正式名稱。
        slogan:
          type: string
          maxLength: 255
          description: 載入編輯器的自訂宣傳文案，並非政府官方標語。
        sourceUrl:
          type: string
          format: uri
          pattern: "^https://"
          description: QR Code 指向的政府官方政策或服務頁面。
        startDate:
          type: [string, "null"]
          format: date
          description: 政策開始日期，包含當日；null 表示無起日限制
        endDate:
          type: [string, "null"]
          format: date
          description: 政策結束日期，包含當日；null 表示無截止日限制
      example:
        id: 9
        category: 老人
        title: 臺北市中低收入老人生活津貼
        slogan: 長者生活有津貼，符合資格來申請！
        sourceUrl: https://dosw.gov.taipei/cp.aspx?n=FCF3DAE98DDA289F
        startDate: "2026-10-07"
        endDate: null

    AuthorSummary:
      type: object
      description: 作品作者的公開顯示資料。
      required: [id, displayName]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: 作者的系統內部使用者 ID。
        displayName:
          type: string
          maxLength: 100
          description: 作者公開顯示名稱。
        badge:
          description: 作者目前的最高等級徽章；尚無徽章時為 null。
          oneOf:
            - $ref: "#/components/schemas/Badge"
            - type: "null"
      example:
        id: 1
        displayName: 小明
        badge:
          level: 3
          name: 四方送暖
          iconUrl: https://assets.example.com/badges/3/badge.png?X-Amz-Expires=900

    Artwork:
      type: object
      description: 已建立並公開展示的長輩圖作品及目前使用者的互動狀態。
      required:
        - id
        - owner
        - backgroundId
        - policyId
        - sloganText
        - imageUrl
        - likeCount
        - downloadCount
        - likedByMe
        - ownedByMe
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: 作品唯一識別碼。
        owner:
          $ref: "#/components/schemas/AuthorSummary"
          description: 作品作者公開摘要。
        backgroundId:
          type: integer
          format: int64
          minimum: 1
          description: 建立作品時選用的背景 ID。
        policyId:
          type: integer
          format: int64
          minimum: 1
          description: 建立作品時選用的政策 ID。
        sloganText:
          type: string
          maxLength: 500
          description: 實際寫入作品的宣傳文案，可能由使用者修改過。
        imageUrl:
          type: string
          format: uri
          description: 有效期 15 分鐘的 S3 presigned URL
        likeCount:
          type: integer
          format: int64
          minimum: 0
          description: 目前愛心總數，重複按愛心不會重複累加。
        downloadCount:
          type: integer
          format: int64
          minimum: 0
          description: 非作者成功下載的累積次數；作者自行下載不計入。
        likedByMe:
          type: boolean
          description: 目前使用者是否已對此作品按愛心。
        ownedByMe:
          type: boolean
          description: 此作品是否由目前使用者建立。
        createdAt:
          type: string
          format: date-time
          description: 作品建立完成的 UTC 時間。
      example:
        id: 123
        owner:
          id: 1
          displayName: 小明
          badge:
            level: 3
            name: 四方送暖
            iconUrl: https://assets.example.com/badges/3/badge.png?X-Amz-Expires=900
        backgroundId: 1
        policyId: 9
        sloganText: 長者生活有津貼，符合資格來申請！
        imageUrl: https://assets.example.com/artworks/1/example.png?X-Amz-Expires=900
        likeCount: 12
        downloadCount: 8
        likedByMe: true
        ownedByMe: false
        createdAt: "2026-11-07T08:30:00Z"

    ArtworkPage:
      type: object
      description: 作品分頁結果；page 從 0 開始。
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          description: 本頁作品，依建立時間由新到舊。
          items:
            $ref: "#/components/schemas/Artwork"
        page:
          type: integer
          minimum: 0
          description: 目前頁碼，從 0 開始。
        size:
          type: integer
          minimum: 1
          maximum: 100
          description: 每頁要求的最大筆數。
        totalElements:
          type: integer
          format: int64
          minimum: 0
          description: 符合條件的作品總筆數。
        totalPages:
          type: integer
          minimum: 0
          description: 依 size 計算的總頁數；沒有資料時為 0。
      example:
        content:
          - id: 123
            owner:
              id: 1
              displayName: 小明
              badge: null
            backgroundId: 1
            policyId: 9
            sloganText: 長者生活有津貼，符合資格來申請！
            imageUrl: https://assets.example.com/artworks/1/example.png?X-Amz-Expires=900
            likeCount: 12
            downloadCount: 8
            likedByMe: false
            ownedByMe: true
            createdAt: "2026-11-07T08:30:00Z"
        page: 0
        size: 20
        totalElements: 1
        totalPages: 1

    CreateArtworkRequest:
      type: object
      description: 建立作品的 multipart/form-data 欄位。
      required: [image, backgroundId, policyId, sloganText]
      properties:
        image:
          type: string
          format: binary
          contentMediaType: image/png
          description: 1080 x 1080 PNG，最大 10 MB
        backgroundId:
          type: integer
          format: int64
          minimum: 1
          description: 已啟用且目前使用者已解鎖的背景 ID。
        policyId:
          type: integer
          format: int64
          minimum: 1
          description: 已啟用且目前日期落在有效期間內的政策 ID。
        sloganText:
          type: string
          minLength: 1
          maxLength: 500
          description: 要保存及顯示在作品上的宣傳文案。
      example:
        image: (binary PNG file)
        backgroundId: 1
        policyId: 9
        sloganText: 長者生活有津貼，符合資格來申請！

    LikeState:
      type: object
      description: 按愛心或取消愛心後的最新狀態。
      required: [artworkId, liked, likeCount]
      properties:
        artworkId:
          type: integer
          format: int64
          minimum: 1
          description: 被操作的作品 ID。
        liked:
          type: boolean
          description: 目前使用者操作後是否已按愛心。
        likeCount:
          type: integer
          format: int64
          minimum: 0
          description: 操作完成後的作品愛心總數。
      example:
        artworkId: 123
        liked: true
        likeCount: 13

    LeaderboardEntry:
      type: object
      description: 單筆排行榜名次與對應作品。
      required: [rank, score, artwork]
      properties:
        rank:
          type: integer
          minimum: 1
          description: Competition ranking 名次；同分同名次，例如 1、2、2、4。
        score:
          type: integer
          format: int64
          minimum: 0
          description: "`max(likeCount, downloadCount)`。"
        artwork:
          $ref: "#/components/schemas/Artwork"
          description: 此名次對應的完整作品資料。
      example:
        rank: 1
        score: 12
        artwork:
          id: 123
