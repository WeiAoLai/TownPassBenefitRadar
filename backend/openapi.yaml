            id: 1
            displayName: 小明
            badge: null
          backgroundId: 1
          policyId: 9
          sloganText: 長者生活有津貼，符合資格來申請！
          imageUrl: https://assets.example.com/artworks/1/example.png?X-Amz-Expires=900
          likeCount: 12
          downloadCount: 8
          likedByMe: false
          ownedByMe: false
          createdAt: "2026-11-07T08:30:00Z"

    Problem:
      type: object
      description: RFC 9457 Problem Details，加上穩定業務錯誤碼與 trace ID。
      required: [title, status, detail, instance, code, traceId]
      properties:
        type:
          type: string
          format: uri-reference
          description: 問題類型 URI；使用 `about:blank` 時 response 可能省略此欄位。
        title:
          type: string
          description: 對應 HTTP status 的簡短標題。
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP status code。
        detail:
          type: string
          description: 可供人員閱讀的錯誤說明；前端流程判斷應使用 code。
        instance:
          type: string
          format: uri-reference
          description: 發生錯誤的 request path。
        code:
          type: string
          description: 前端可依賴的穩定業務錯誤碼
          enum:
            - ARTWORK_IMAGE_DIMENSIONS_INVALID
            - ARTWORK_IMAGE_INVALID
            - ARTWORK_IMAGE_TOO_LARGE
            - ARTWORK_NOT_FOUND
            - AUTH_INVALID
            - AUTH_REQUIRED
            - BACKGROUND_LOCKED
            - BACKGROUND_NOT_FOUND
            - BACKGROUND_UNAVAILABLE
            - INTERNAL_ERROR
            - PAGE_INVALID
            - POLICY_NOT_FOUND
            - POLICY_UNAVAILABLE
            - RATE_LIMITED
            - REQUEST_INVALID
            - REQUEST_REJECTED
            - RESOURCE_NOT_FOUND
            - SELF_LIKE_NOT_ALLOWED
            - STORAGE_UNAVAILABLE
            - VALIDATION_FAILED
        traceId:
          type: string
          description: 用於查詢後端 log，不包含個資
      example:
        title: Not Found
        status: 404
        detail: Artwork was not found
        instance: /api/v1/artworks/123
        code: ARTWORK_NOT_FOUND
        traceId: 6f44d183-f415-4c2c-9b2f-c35b657a15dc
