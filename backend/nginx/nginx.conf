events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=artwork_downloads:10m rate=30r/m;
    log_format api_json escape=json '{"time":"$time_iso8601","traceId":"$request_id","method":"$request_method","path":"$uri","status":$status,"requestTime":$request_time,"upstreamTime":"$upstream_response_time"}';
    access_log /dev/stdout api_json;
    error_log /dev/stderr warn;

    upstream good_morning_api {
        server api:8080;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 11m;

        location = /health {
            proxy_pass http://good_morning_api/api/actuator/health;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/artworks/[0-9]+/download$ {
            limit_req zone=artwork_downloads burst=5 nodelay;
            limit_req_status 429;
            error_page 429 = @rate_limited;
            proxy_pass http://good_morning_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location @rate_limited {
            default_type application/problem+json;
            add_header Retry-After 2 always;
            add_header X-Request-ID $request_id always;
            return 429 '{"type":"about:blank","title":"Too Many Requests","status":429,"detail":"Download rate limit exceeded","code":"RATE_LIMITED","traceId":"$request_id"}';
        }

        location /api/ {
            proxy_pass http://good_morning_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 60s;
        }
    }
}
