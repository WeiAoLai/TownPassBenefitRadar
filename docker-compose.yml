version: '3.8'

services:
  # ==============================
  # 前端服務 (Vue + Nginx)
  # ==============================
  frontend:
    build:
      context: ./GoodMorning
      dockerfile: Dockerfile
      args:
        # 【關鍵修正】覆寫 Dockerfile 預設的 mock，改為 http 以串接真實後端
        - VITE_API_MODE=http
    container_name: vue-frontend
    ports:
      - "80:80"
    environment:
      # Nginx 啟動時會讀取此變數來設定反向代理 (需與後端服務名稱一致)
      - BACKEND_URL=http://backend:8080
    restart: always
    depends_on:
      - backend

  # ==============================
  # 後端服務 (Spring Boot)
  # ==============================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spring-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # 1. 啟用 demo 環境設定檔
      - SPRING_PROFILES_ACTIVE=demo
      # 2. 強制將主程式與 Flyway 的資料庫連線從 localhost 改為 mariadb 容器
      - SPRING_DATASOURCE_URL=jdbc:mariadb://mariadb:3306/${MYSQL_DATABASE:-goodmorning}
      - SPRING_FLYWAY_URL=jdbc:mariadb://mariadb:3306/${MYSQL_DATABASE:-goodmorning}
      # 確保帳號密碼與下方 MariaDB 容器一致 (讀取自 .env)
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
    restart: always
    depends_on:
      - mariadb

  # ==============================
  # 資料庫服務 (MariaDB)
  # ==============================
  mariadb:
    image: mariadb:10.11
    container_name: mariadb-db
    ports:
      - "3306:3306"
    env_file:
      - .env
    environment:
      # 【關鍵修正】使用 MARIADB_ROOT_PASSWORD 讓新版資料庫成功讀取密碼
      - MARIADB_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-goodmorning}
      - TZ=Asia/Taipei
    volumes:
      - db-data:/var/lib/mysql
    restart: always

volumes:
  # 建立持久化儲存，確保容器重啟時資料庫不會被清空
  db-data:
