name: Deploy Full Stack to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    # Remove this condition to resume EC2 deployments.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Package tracked deployment files
        run: git archive --format=tar.gz --output=deployment.tar.gz HEAD docker-compose.yml .env.example GoodMorning backend

      - name: Copy deployment archive to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deployment.tar.gz
          target: "/home/ubuntu/taipei-code-fest-app"
          overwrite: true

      - name: Deploy Docker Compose and verify routes
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -eu
            cd /home/ubuntu/taipei-code-fest-app
            tar -xzf deployment.tar.gz
            rm deployment.tar.gz
            if [ ! -r .env ]; then
              echo 'Create the EC2 .env from .env.example before deploying.' >&2
              exit 1
            fi

            docker compose config --quiet
            if ! docker compose up --build --wait --wait-timeout 300; then
              docker compose ps
              exit 1
            fi

            check_route() {
              status=$(curl --silent --show-error --output /dev/null --max-time 10 \
                --write-out '%{http_code}' "$@")
              echo "$1 returned HTTP $status"
              test "$status" = 200
            }

            check_route http://127.0.0.1/healthz
            check_route http://127.0.0.1/api/v1/me --header 'X-Demo-User: user-a'
            check_route http://127.0.0.1/grafana/api/health
            docker image prune -f
